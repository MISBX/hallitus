.tab-btn.active{border-bottom-color:#2563eb;color:#2563eb;font-weight:700}
.tab-btn:hover{color:#2563eb}
.content{padding:22px 28px;max-width:1100px}

.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kpi-label{font-size:10.5px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kpi-years{display:flex;gap:12px;align-items:flex-end;margin-bottom:6px}
.kpi-year{text-align:left}
.kpi-year-label{font-size:10px;color:#64748b}
.kpi-year-val{font-size:18px;font-weight:800}
.kpi-year-val.muted{color:#94a3b8}
.kpi-year-val.main{color:#1a2e4a}
.kpi-delta{margin-left:auto;text-align:right}
.tag{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
.tag-green{background:#dcfce7;color:#16a34a}
.tag-red{background:#fee2e2;color:#dc2626}
.tag-blue{background:#dbeafe;color:#2563eb}
.tag-amber{background:#fef3c7;color:#d97706}
.ibox{border-radius:8px;padding:10px 14px;font-size:12.5px;line-height:1.7;margin-bottom:10px}
.ibox-blue{background:#eff6ff;border:1px solid #bfdbfe}
.ibox-green{background:#f0fdf4;border:1px solid #bbf7d0}
.ibox-red{background:#fff1f2;border:1px solid #fecdd3}
.ibox-amber{background:#fffbeb;border:1px solid #fde68a}
.section-title{border-left:4px solid #2563eb;padding-left:12px;font-size:15px;font-weight:700;color:#1a2e4a;margin-bottom:13px;margin-top:20px}
.section-title:first-child{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:#1a2e4a;color:#fff}
th{text-align:left;padding:8px 12px;font-weight:600}
th.right,td.right{text-align:right}
tbody tr{border-bottom:1px solid #e2e8f0}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr.total-row{background:#eff6ff;font-weight:700;border-top:2px solid #2563eb}
td{padding:8px 12px}
.chart-wrap{position:relative;margin-bottom:14px}
canvas{max-height:280px}
.footer{margin-top:24px;padding-top:12px;border-top:1px solid #e2e8f0;font-size:10.5px;color:#94a3b8}
/* Asiakasanalyysi */
.search-box{width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;margin-bottom:14px;outline:none}
.search-box:focus{border-color:#2563eb;box-shadow:0 0 0 3px #eff6ff}
.search-result{display:none}

.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.profile-cell{text-align:center;padding:8px;background:#f8fafc;border-radius:6px;font-size:12px}
.profile-cell-label{color:#64748b;font-size:10px;margin-bottom:2px}
.bar-mini{height:6px;border-radius:3px;background:#2563eb;margin-top:4px}
/* KV */
.placeholder-box{background:#f8fafc;border:2px dashed #e2e8f0;border-radius:10px;padding:40px;text-align:center;color:#94a3b8}

const fmt=(n)=>n==null?'—':Math.round(n).toLocaleString('fi-FI');
const fmtE=(n)=>n==null?'—':fmt(n)+' €';
const pct=(a,b)=>b?((a-b)/b*100).toFixed(1)+' %':'—';
function deltaTag(a,b){
  if(!b&&!a)return '<span class="tag tag-amber">—</span>';
  if(!b)return '<span class="tag tag-green">uusi</span>';
  const p=(a-b)/b*100;
  const lbl=(p>=0?'+':'')+p.toFixed(1)+' %';
  return p>=0?`<span class="tag tag-green">${lbl}</span>`:`<span class="tag tag-red">${lbl}</span>`;
}
function makePctTag(p){
  const lbl=(p>=0?'+':'')+p.toFixed(1)+' %';
  return p>=0?`<span class="tag tag-green">${lbl}</span>`:`<span class="tag tag-red">${lbl}</span>`;
}

const chartRegistry={};
function destroyChart(id){if(chartRegistry[id]){chartRegistry[id].destroy();delete chartRegistry[id];}}

function barChart(canvasId,labels,datasets,opts={}){
  destroyChart(canvasId);
  const ctx=document.getElementById(canvasId);
  if(!ctx)return;
  chartRegistry[canvasId]=new Chart(ctx,{
    type:'bar',
    data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{font:{size:11}}},tooltip:{callbacks:{label:c=>fmtE(c.raw)}}},
      scales:{
        x:{ticks:{font:{size:11}}},
        y:{ticks:{font:{size:10},callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v},...(opts.yMax?{max:opts.yMax}:{})},
      },
      ...opts.extra
    }
  });
}

  destroyChart(canvasId);

  chartRegistry[canvasId]=new Chart(ctx,{

      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{font:{size:11}}},tooltip:{callbacks:{label:c=>fmtE(c.raw)}}},
      scales:{x:{ticks:{font:{size:11}}},y:{ticks:{font:{size:10},callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v}}},
    }
  });
}

function searchCustomer(q){
  const el=document.getElementById('searchResult');
  if(!q||q.length<2){el.classList.remove('visible');el.innerHTML='';return;}
  const matches=Object.entries(customerData).filter(([k])=>k.toLowerCase().includes(q.toLowerCase()));
  if(!matches.length){el.classList.add('visible');el.innerHTML='<p style="color:#64748b;padding:12px">Ei hakutuloksia.</p>';return;}
  
  const [asiakas,data]=matches[0];
  const CATS=['Työvaatteet','Edustusvaatteet','Kengät','Päähineet','Liikelahjat','Logomerkkaus','Promotuotteet','Suojaimet','Toimituskulut'];
  const total25=Object.values(data.y25||{}).reduce((s,v)=>s+v,0);
  const total26=Object.values(data.y26||{}).reduce((s,v)=>s+v,0);
  
  const catRows=CATS.map(cat=>{
    const v25=(data.y25||{})[cat]||0;
    const v26=(data.y26||{})[cat]||0;
    if(!v25&&!v26)return '';
    return `<tr>
      <td>${cat}</td>
      <td class="right" style="color:#94a3b8">${v25?fmtE(v25):'—'}</td>
      <td class="right" style="font-weight:700">${v26?fmtE(v26):'—'}</td>
      <td class="right">${deltaTag(v26,v25)}</td>
    </tr>`;
  }).filter(Boolean).join('');

  el.classList.add('visible');
  el.innerHTML=`
    <div style="font-size:16px;font-weight:800;color:#1a2e4a;margin-bottom:12px">${asiakas}${matches.length>1?` <span style="font-size:12px;color:#64748b">(+ ${matches.length-1} muuta hakutulosta)</span>`:''}</div>
    <div style="display:flex;gap:24px;margin-bottom:16px">
      <div><div style="font-size:10px;color:#64748b">2025 maalis-touko</div><div style="font-size:22px;font-weight:800;color:#1a2e4a">${fmtE(total25)||'—'}</div></div>
      <div><div style="font-size:10px;color:#64748b">2026 tammi-touko</div><div style="font-size:22px;font-weight:800;color:#2563eb">${fmtE(total26)||'—'}</div></div>
      <div style="display:flex;align-items:center">${total25?deltaTag(total26,total25):'<span class="tag tag-blue">uusi asiakas</span>'}</div>
    </div>
    <table>
      <thead><tr><th>Tuoteryhmä</th><th class="right">2025</th><th class="right">2026</th><th class="right">Muutos</th></tr></thead>
      <tbody>${catRows||'<tr><td colspan="4" style="color:#64748b;padding:12px">Ei tuoteryhmädataa.</td></tr>'}</tbody>
    </table>`;
}

function getTabContent(){
  switch(currentTab){
    case 'yhteenveto': return renderYhteenveto();
    case 'myynti': return toggleHTML();
    case 'tuoteryhmät': return toggleHTML();
    case 'asiakasanalyysi': return renderAsiakasanalyysi();
    case 'kontaktointi': return toggleHTML();
    case 'dealit': return toggleHTML();
    case 'levelup': return renderLevelup();
    case 'kv': return renderKV();
    case 'myynnin_lasku': return renderMyynnin();
    case 'tiimit': return renderTiimit();
    case 'myyjat': return renderMyyjat();
    case 'putket': return renderPutket();
    default: return '';
  }
}

function renderToggleContent(){
  const el=document.getElementById('toggleContent');
  if(!el) return;
  let html='';
  if(currentTab==='myynti') html=toggle==='kk'?renderMyyntiKk():renderMyyntiYTD();
  else if(currentTab==='tuoteryhmät') html=toggle==='ytd'?renderTuoteryhmätYTD():renderTuoteryhmätKk();
  else if(currentTab==='kontaktointi') html=toggle==='kk'?renderKontaktointiKk():renderKontaktointiYTD();
  else if(currentTab==='dealit') html=toggle==='kk'?renderDealitKk():renderDealitYTD();
  el.innerHTML=html;
  setTimeout(initCharts,50);
}

function renderContent(){
  const c=document.getElementById('content');
  c.innerHTML=getTabContent()+'<div class="footer">Lähteet: Drive-asiakasraportit + tuoteryhmäraportit (Veroton summa) | HubSpot CRM live-haku 15.6.2026 | Luottamuksellinen — vain hallituksen käyttöön</div>';
  renderToggleContent();
  setTimeout(initCharts,100);
}

    <div class="section-title">Ohituskaistamyynti — avoin putki per myyjä YTD 2026</div>
    <div class="card">
      <table>
        <thead><tr><th>Myyjä</th><th class="right">Avoin (kpl)</th><th class="right">Avoin (€)</th><th class="right">Won (kpl)</th><th class="right">Won (€)</th></tr></thead>
        <tbody>${myyjatRows('ok')||'<tr><td colspan="5" style="color:#64748b;padding:12px">Ei dataa tai putki käynnistymässä</td></tr>'}</tbody>
      </table>
    </div>

    <div class="ibox ibox-amber">
      <strong>⚠️ Ohituskaistamyynti:</strong> Won-dealeja ei vielä 2026 YTD. Putki on pidempi sykli — avoimia dealeja ${okAvoin.kpl} kpl / ${fmtE(okAvoin.summa)}. Seuranta tärkeää H2 2026.
    </div>`;
}

// ── CHART INIT TIIMIT ────────────────────────────────────────────────────────
function initTiimitCharts() {
  if(currentTab !== 'tiimit') return;
  const intPuh = hsKuukaudet.map((_,i) => ['HP','MI','MR'].reduce((s,k)=>s+(hsPuhelut[k][i]||0),0));
  const fgtPuh = hsKuukaudet.map((_,i) => ['KR','JH'].reduce((s,k)=>s+(hsPuhelut[k][i]||0),0));
  const opsPuh = hsKuukaudet.map((_,i) => ['MP','EW','ER','JS'].reduce((s,k)=>s+(hsPuhelut[k][i]||0),0));
  barCount('tiimitPuhChart', hsKuukaudet, [
    {label:'INT',data:intPuh,backgroundColor:'#2563eb',borderRadius:4},
    {label:'FGT',data:fgtPuh,backgroundColor:'#16a34a',borderRadius:4},
    {label:'OPS',data:opsPuh,backgroundColor:'#d97706',borderRadius:4},
  ]);
  const intTap = hsKuukaudet.map((_,i) => ['HP','MI','MR'].reduce((s,k)=>s+(hsTapaamiset[k][i]||0),0));
  const fgtTap = hsKuukaudet.map((_,i) => ['KR','JH'].reduce((s,k)=>s+(hsTapaamiset[k][i]||0),0));
  const opsTap = hsKuukaudet.map((_,i) => ['MP','EW','ER','JS'].reduce((s,k)=>s+(hsTapaamiset[k][i]||0),0));
  barCount('tiimitTapChart', hsKuukaudet, [
    {label:'INT',data:intTap,backgroundColor:'#2563eb',borderRadius:4},
    {label:'FGT',data:fgtTap,backgroundColor:'#16a34a',borderRadius:4},
    {label:'OPS',data:opsTap,backgroundColor:'#d97706',borderRadius:4},
  ]);
}

renderTabs();
renderContent();
