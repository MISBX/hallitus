<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#1e293b;font-size:13.5px}
.header{background:#1a2e4a;color:#fff;padding:22px 32px 16px}
.header-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;opacity:.45;margin-bottom:4px}
.header-title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.header-sub{font-size:12px;opacity:.55;margin-top:3px}
.tabs{background:#fff;border-bottom:1px solid #e2e8f0;display:flex;padding:0 32px;overflow-x:auto;gap:2px}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:12px 16px;font-size:12.5px;font-weight:500;color:#64748b;cursor:pointer;white-space:nowrap;transition:color .15s}
.tab.active{border-bottom-color:#2563eb;color:#2563eb;font-weight:700}
.tab:hover{color:#2563eb}
.content{padding:24px 32px;max-width:1100px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:16px}
.section-title{border-left:4px solid #2563eb;padding-left:12px;font-size:14px;font-weight:700;color:#1a2e4a;margin-bottom:14px;margin-top:22px}
.section-title:first-child{margin-top:0}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px 18px}
.kpi-label{font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kpi-row{display:flex;gap:14px;align-items:flex-end;margin-bottom:6px}
.kpi-yr{text-align:left}
.kpi-yr-l{font-size:10px;color:#94a3b8}
.kpi-yr-v{font-size:20px;font-weight:800;color:#1a2e4a}
.kpi-delta{margin-left:auto}
.tag{display:inline-block;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:700}
.tag-g{background:#dcfce7;color:#16a34a}
.tag-r{background:#fee2e2;color:#dc2626}
.tag-b{background:#dbeafe;color:#2563eb}
.tag-a{background:#fef3c7;color:#d97706}
.ibox{border-radius:8px;padding:10px 14px;font-size:12.5px;line-height:1.75;margin-bottom:12px}
.ibox-g{background:#f0fdf4;border:1px solid #bbf7d0}
.ibox-r{background:#fff1f2;border:1px solid #fecdd3}
.ibox-b{background:#eff6ff;border:1px solid #bfdbfe}
.ibox-a{background:#fffbeb;border:1px solid #fde68a}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead tr{background:#1a2e4a;color:#fff}
th{text-align:left;padding:9px 13px;font-weight:600;font-size:11.5px}
th.r,td.r{text-align:right}
th.c,td.c{text-align:center}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr{border-bottom:1px solid #e2e8f0}
td{padding:8px 13px}
.total-row{background:#eff6ff!important;font-weight:700;border-top:2px solid #2563eb}
.pri-k{color:#dc2626;font-weight:700}
.pri-h{color:#d97706;font-weight:700}
.pri-m{color:#64748b}
.up{color:#16a34a}
.dn{color:#dc2626}
.ytd-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:16px 20px;margin-bottom:16px}
.ytd-title{font-size:12px;font-weight:700;color:#1e40af;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.ytd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ytd-stat{text-align:center}
.ytd-stat-v{font-size:22px;font-weight:800;color:#1a2e4a}
.ytd-stat-l{font-size:10px;color:#64748b;margin-top:2px}
</style>
</head>

const bar=document.getElementById("tabBar");
tabs.forEach(t=>{

function kpiCard(label,v25,v26,v26fmt,chgPct,suffix=""){
  const neg=chgPct<0;
  return`<div class="kpi">
    <div class="kpi-label">${label}</div>
    <div class="kpi-row">
      <div class="kpi-yr"><div class="kpi-yr-l">2025</div><div class="kpi-yr-v">${v25}</div></div>
      <div class="kpi-yr"><div class="kpi-yr-l">2026</div><div class="kpi-yr-v">${v26fmt}</div></div>
      <div class="kpi-delta">${tag(chgPct)}</div>
    </div>${suffix}</div>`;
}

function monthlyTable(){
  const rows=months.map((m,i)=>{
    const chg=(data26[i]-data25[i])/data25[i]*100;
    const neg=chg<0;
    return`<tr>
      <td>${m}</td>
      <td class="r">${fmtE(data25[i])}</td>
      <td class="r">${fmtE(data26[i])}</td>
      <td class="r">${fmtE(bud26[i])}</td>
      <td class="r ${neg?"dn":"up"}">${pct(chg)}</td>
      <td class="c">${kate25[i].toFixed(1)}%</td>
      <td class="c">${kate26[i].toFixed(1)}%</td>
      <td class="c ${kate26[i]-kate25[i]<0?"dn":"up"}">${(kate26[i]-kate25[i]).toFixed(1)} pp</td>
    </tr>`;
  }).join("");
  const chgYtd=(ytd26-ytd25)/ytd25*100;
  return`<table>
    <thead><tr>
      <th>Kuukausi</th><th class="r">LV 2025 €</th><th class="r">LV 2026 €</th>
      <th class="r">Budjetti €</th><th class="r">Muutos %</th>
      <th class="c">Kate% 2025</th><th class="c">Kate% 2026</th><th class="c">Δ pp</th>
    </tr></thead>
    <tbody>${rows}
    <tr class="total-row">
      <td>TAMMI–ELO YTD</td>
      <td class="r">${fmtE(ytd25)}</td><td class="r">${fmtE(ytd26)}</td>
      <td class="r">${fmtE(ytdBud)}</td>
      <td class="r ${chgYtd<0?"dn":"up"}">${pct(chgYtd)}</td>
      <td class="c">${(ytdKate25/ytd25*100).toFixed(1)}%</td>
      <td class="c">${(ytdKate26/ytd26*100).toFixed(1)}%</td>
      <td class="c ${ytdKate26/ytd26<ytdKate25/ytd25?"dn":"up"}">${((ytdKate26/ytd26-ytdKate25/ytd25)*100).toFixed(1)} pp</td>
    </tr></tbody></table>`;
}

  else if(currentTab==="uudet"){

    <div class="section-title">▶ Elokuu 2026 — Merkittävimmät uudet asiakkaat</div>
    <div class="card"><table>
      <thead><tr><th>#</th><th>Asiakas</th><th class="r">Myynti €</th><th class="c">Kate%</th><th>Potentiaali</th></tr></thead>
