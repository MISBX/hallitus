<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SB Myyntiseuranta – Tammi–Elokuu 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#1e293b;font-size:13.5px}
.header{background:#1a2e4a;color:#fff;padding:22px 32px 16px}
.header-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;opacity:.45;margin-bottom:4px}
.header-title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.header-sub{font-size:12px;opacity:.55;margin-top:3px}
.tabs{background:#fff;border-bottom:1px solid #e2e8f0;display:flex;padding:0 32px;overflow-x:auto;gap:2px}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:12px 16px;font-size:12.5px;font-weight:500;color:#64748b;cursor:pointer;white-space:nowrap;transition:color .15s}
.tab.active{border-bottom-color:#2563eb;color:#2563eb;font-weight:700}
.tab:hover{color:#2563eb}
.content{padding:24px 32px;max-width:1100px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:16px}
.sec{border-left:4px solid #2563eb;padding-left:12px;font-size:14px;font-weight:700;color:#1a2e4a;margin-bottom:14px;margin-top:22px}
.sec:first-child{margin-top:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px 18px}
.kpi-l{font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kpi-row{display:flex;gap:14px;align-items:flex-end;margin-bottom:6px}
.kpi-yr{text-align:left}
.kpi-yl{font-size:10px;color:#94a3b8}
.kpi-yv{font-size:20px;font-weight:800;color:#1a2e4a}
.kpi-d{margin-left:auto}
.tag{display:inline-block;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:700}
.tg{background:#dcfce7;color:#16a34a}
.tr{background:#fee2e2;color:#dc2626}
.ta{background:#fef3c7;color:#d97706}
.ibox{border-radius:8px;padding:10px 14px;font-size:12.5px;line-height:1.75;margin-bottom:12px}
.ig{background:#f0fdf4;border:1px solid #bbf7d0}
.ir{background:#fff1f2;border:1px solid #fecdd3}
.ib{background:#eff6ff;border:1px solid #bfdbfe}
.ia{background:#fffbeb;border:1px solid #fde68a}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead tr{background:#1a2e4a;color:#fff}
th{text-align:left;padding:9px 13px;font-weight:600;font-size:11.5px}
th.r,td.r{text-align:right}
th.c,td.c{text-align:center}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr{border-bottom:1px solid #e2e8f0}
td{padding:8px 13px}
.tot{background:#eff6ff!important;font-weight:700;border-top:2px solid #2563eb}
.up{color:#16a34a}
.dn{color:#dc2626}
.ytdb{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:16px 20px;margin-bottom:16px}
.ytdt{font-size:12px;font-weight:700;color:#1e40af;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.ytdg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ytds{text-align:center}
.ytdsv{font-size:22px;font-weight:800;color:#1a2e4a}
.ytdsl{font-size:10px;color:#64748b;margin-top:2px}
.pk{color:#dc2626;font-weight:700}
.ph{color:#d97706;font-weight:700}
.pm{color:#64748b}
</style>
</head>
<body>
<div class="header">
  <div class="header-label">Suomen Brodeeraus Oy — Hallitusraportti</div>
  <div class="header-title">Myyntiseuranta — Tammi–Elokuu 2026</div>
  <div class="header-sub">Vertailu 2025 | Budjetti | Asiakkaat | Tuoteryhmät &nbsp;|&nbsp; Data: Tehden 1.8.2026</div>
</div>
<div class="tabs" id="tabBar"></div>
<div class="content" id="content"></div>
<script>
var d25=[179868,226864,342016,400398,315360,260556,125962,263968];
var d26=[192772,210886,263139,335678,318889,274241,128435,235482];
var k25=[36.2,36.2,29.2,40.0,41.4,34.4,34.5,38.0];
var k26=[35.1,33.6,35.5,33.5,28.8,37.3,38.2,33.5];
var b26=[202906,200313,330155,443274,343680,308021,155900,282139];
var t25=[522,599,832,748,799,1255,878,1184];
var t26=[488,450,588,737,690,610,419,521];
var mn=["Tammikuu","Helmikuu","Maaliskuu","Huhtikuu","Toukokuu","Kesakuu","Heinakuu","Elokuu"];

function sum(a){return a.reduce(function(x,y){return x+y;},0);}
var y25=sum(d25),y26=sum(d26),yb=sum(b26);
var yk25=d25.map(function(v,i){return v*k25[i]/100;}).reduce(function(a,b){return a+b;},0);
var yk26=d26.map(function(v,i){return v*k26[i]/100;}).reduce(function(a,b){return a+b;},0);

function fe(v){if(v==null)return"—";return v.toLocaleString("fi-FI",{minimumFractionDigits:0,maximumFractionDigits:0})+" \u20ac";}
function fp(v){if(v==null)return"—";return (v>0?"+":"")+v.toFixed(1)+"%";}
function tag(v){var cl=v>=0?"tg":"tr";return '<span class="tag '+cl+'">'+fp(v)+'</span>';}

var tabs=[
  {id:"yhteenveto",label:"\uD83D\uDCCA Yhteenveto"},
  {id:"tuoteryh",label:"\uD83D\uDCE6 Tuoteryhm\u00e4t"},
  {id:"top",label:"\uD83C\uDFC6 Top Asiakkaat"},
  {id:"uudet",label:"\u2705 Uudet"},
  {id:"menetetyt",label:"\u26A0\uFE0F Menetetyt"},
  {id:"budjetti",label:"\uD83C\uDFAF Budjetti"},
  {id:"ennuste",label:"\uD83D\uDCC8 Ennuste 2026"}
];

var cur="yhteenveto";
var bar=document.getElementById("tabBar");
tabs.forEach(function(t){
  var btn=document.createElement("button");
  btn.className="tab"+(t.id===cur?" active":"");
  btn.textContent=t.label;
  btn.onclick=function(){
    cur=t.id;
    render();
    for(var i=0;i<tabs.length;i++){
      bar.children[i].className="tab"+(tabs[i].id===t.id?" active":"");
    }
  };
  bar.appendChild(btn);
});

function render(){
  var el=document.getElementById("content");
  if(cur==="yhteenveto") renderYhteenveto(el);
  else if(cur==="tuoteryh") renderTuoteryh(el);
  else if(cur==="top") renderTop(el);
  else if(cur==="uudet") renderUudet(el);
  else if(cur==="menetetyt") renderMenetetyt(el);
  else if(cur==="budjetti") renderBudjetti(el);
  else if(cur==="ennuste") renderEnnuste(el);
}

function kpiCard(label,v25str,v26str,chg){
  return '<div class="kpi"><div class="kpi-l">'+label+'</div><div class="kpi-row"><div class="kpi-yr"><div class="kpi-yl">2025</div><div class="kpi-yv">'+v25str+'</div></div><div class="kpi-yr"><div class="kpi-yl">2026</div><div class="kpi-yv">'+v26str+'</div></div><div class="kpi-d">'+tag(chg)+'</div></div></div>';
}

function mTable(){
  var rows="";
  for(var i=0;i<8;i++){
    var chg=(d26[i]-d25[i])/d25[i]*100;
    var dp=k26[i]-k25[i];
    rows+='<tr><td>'+mn[i]+'</td><td class="r">'+fe(d25[i])+'</td><td class="r">'+fe(d26[i])+'</td><td class="r">'+fe(b26[i])+'</td>'
      +'<td class="r '+(chg<0?"dn":"up")+'">'+fp(chg)+'</td>'
      +'<td class="c">'+k25[i].toFixed(1)+'%</td><td class="c">'+k26[i].toFixed(1)+'%</td>'
      +'<td class="c '+(dp<0?"dn":"up")+'">'+(dp>0?"+":"")+dp.toFixed(1)+' pp</td></tr>';
  }
  var cy=(y26-y25)/y25*100;
  var kp26=yk26/y26*100, kp25=yk25/y25*100;
  rows+='<tr class="tot"><td>TAMMI\u2013ELO YTD</td><td class="r">'+fe(y25)+'</td><td class="r">'+fe(y26)+'</td><td class="r">'+fe(yb)+'</td>'
    +'<td class="r '+(cy<0?"dn":"up")+'">'+fp(cy)+'</td>'
    +'<td class="c">'+kp25.toFixed(1)+'%</td><td class="c">'+kp26.toFixed(1)+'%</td>'
    +'<td class="c '+((kp26-kp25)<0?"dn":"up")+'">'+(kp26>kp25?"+":"")+(kp26-kp25).toFixed(1)+' pp</td></tr>';
  return '<table><thead><tr><th>Kuukausi</th><th class="r">LV 2025 \u20ac</th><th class="r">LV 2026 \u20ac</th><th class="r">Budjetti \u20ac</th><th class="r">Muutos %</th><th class="c">Kate% 2025</th><th class="c">Kate% 2026</th><th class="c">\u0394 pp</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function renderYhteenveto(el){
  var cl=(y26-y25)/y25*100, cb=(y26-yb)/yb*100, ck=(yk26/y26-yk25/y25)*100;
  var h='<div class="ytdb"><div class="ytdt">\uD83C\uDFC1 YTD Tammi\u2013Elokuu 2026</div><div class="ytdg">'
    +'<div class="ytds"><div class="ytdsv">'+(y26/1e6).toFixed(2)+' M\u20ac</div><div class="ytdsl">Liikevaihto 2026</div></div>'
    +'<div class="ytds"><div class="ytdsv '+(cl<0?"dn":"up")+'">'+fp(cl)+'</div><div class="ytdsl">vs 2025 ('+(y25/1e6).toFixed(2)+' M\u20ac)</div></div>'
    +'<div class="ytds"><div class="ytdsv '+(cb<0?"dn":"up")+'">'+fp(cb)+'</div><div class="ytdsl">vs Budjetti ('+(yb/1e6).toFixed(2)+' M\u20ac)</div></div>'
    +'<div class="ytds"><div class="ytdsv '+(ck<0?"dn":"up")+'">'+(yk26/y26*100).toFixed(1)+'%</div><div class="ytdsl">Kate-% 2026 (oli '+(yk25/y25*100).toFixed(1)+'%)</div></div>'
    +'</div></div>';
  h+='<div class="sec">Elokuu 2026 \u2014 Tuorein kuukausi</div>';
  h+='<div class="grid3">'
    +kpiCard("Liikevaihto",fe(d25[7]),fe(d26[7]),(d26[7]-d25[7])/d25[7]*100)
    +kpiCard("Myyntikate %",k25[7].toFixed(1)+"%",k26[7].toFixed(1)+"%",k26[7]-k25[7])
    +kpiCard("Tilauksia",t25[7].toString(),t26[7].toString(),(t26[7]-t25[7])/t25[7]*100)
    +'</div>';
  h+='<div class="ibox ig">\u2705 <strong>Elokuun iso uutuus:</strong> Jyv\u00e4skyl\u00e4n koulutuskuntayhtym\u00e4 Gradia 47 164 \u20ac \u2014 elokuun ylivoimainen #1. Uusi merkitt\u00e4v\u00e4 julkinen asiakkuus.</div>';
  h+='<div class="ibox ir">\u26A0\uFE0F <strong>Elokuu \u221210.8% vs 2025</strong> \u2014 Anuco Oy l\u00e4hes kokonaan poissa. Kattotutka-ketjun lasku jatkuu.</div>';
  h+='<div class="sec">Kuukausittainen kehitys \u2014 Tammi\u2013Elokuu 2026</div>';
  h+='<div class="card">'+mTable()+'</div>';
  h+='<div class="grid2"><div class="ibox ig">\u2705 <strong>Positiivista:</strong><br>\u2022 Kes\u00e4kuu +5.2% (274 241\u20ac)<br>\u2022 Hein\u00e4kuu +1.9% (128 435\u20ac)<br>\u2022 Kate-% hein\u00e4kuussa 38.2%<br>\u2022 KSBR Sverige AB \u2014 uusi kv-asiakas</div>'
    +'<div class="ibox ir">\u26A0\uFE0F <strong>Seurattavaa:</strong><br>\u2022 YTD \u221212.7% vs 2025<br>\u2022 YTD \u221214.5% vs budjetti<br>\u2022 Kate-% YTD laskenut 35.3% \u2192 34.1%<br>\u2022 Kattokeskus-ketjun poistumat jatkuvat</div></div>';
  el.innerHTML=h;
}

function trRow(name,lv25,lv26,k25p,k26p,isTotal){
  var chg=lv25?(lv26-lv25)/lv25*100:null;
  var c=isTotal?"tot":"";
  return '<tr class="'+c+'"><td>'+name+'</td><td class="r">'+fe(lv25)+'</td><td class="c">'+k25p.toFixed(1)+'%</td>'
    +'<td class="r">'+fe(lv26)+'</td><td class="c">'+k26p.toFixed(1)+'%</td>'
    +'<td class="r '+(chg!=null&&chg<0?"dn":"up")+'">'+(chg!=null?fp(chg):"—")+'</td></tr>';
}
function trTable(h){
  return '<table><thead><tr><th>Tuoteryhm\u00e4</th><th class="r">LV 2025 \u20ac</th><th class="c">Kate%</th><th class="r">LV 2026 \u20ac</th><th class="c">Kate%</th><th class="r">Muutos %</th></tr></thead><tbody>'+h+'</tbody></table>';
}

function renderTuoteryh(el){
  var eloRows=trRow("Edustusvaatteet",49888,48849,45.7,48.4,false)+trRow("Keng\u00e4t",17504,27014,18.1,20.2,false)+trRow("Liikelahjat",3686,3493,43.9,53.2,false)+trRow("Logomerkkaus",10090,9580,93.6,93.7,false)+trRow("Promotuotteet",14606,8623,42.8,53.9,false)+trRow("P\u00e4\u00e4hineet",46822,10349,39.3,56.8,false)+trRow("Suojaimet",5031,3798,25.8,27.5,false)+trRow("Toimituskulut",4033,2976,100,100,false)+trRow("Ty\u00f6vaatteet",85557,99525,16.6,21.7,false)+trRow("Muut",26132,9155,73.6,-5.2,false)+trRow("YHTEENS\u00c4",263968,235482,38.0,33.5,true);
  var heinaRows=trRow("Edustusvaatteet",19982,27635,43.1,36.4,false)+trRow("Keng\u00e4t",13512,13636,3.0,20.0,false)+trRow("Liikelahjat",1622,418,47.9,-170.7,false)+trRow("Logomerkkaus",10461,9594,99.8,100,false)+trRow("Promotuotteet",6166,2842,57.6,45.9,false)+trRow("P\u00e4\u00e4hineet",9608,8894,24.8,57.1,false)+trRow("Suojaimet",1923,3673,29.1,31.8,false)+trRow("Toimituskulut",3336,2257,100,100,false)+trRow("Ty\u00f6vaatteet",51387,53542,25.1,27.6,false)+trRow("Muut",4965,4645,36.6,11.3,false)+trRow("YHTEENS\u00c4",125962,128435,34.5,38.2,true);
  var kesaRows=trRow("Edustusvaatteet",59150,60997,42.6,46.3,false)+trRow("Keng\u00e4t",18856,14583,16.6,21.1,false)+trRow("Liikelahjat",13880,8390,38.2,28.9,false)+trRow("Logomerkkaus",10215,14758,99.4,99.9,false)+trRow("Promotuotteet",14373,9091,35.4,66.2,false)+trRow("P\u00e4\u00e4hineet",23295,17899,37.2,54.5,false)+trRow("Suojaimet",3807,2967,29.1,31.1,false)+trRow("Toimituskulut",4359,3961,100,100,false)+trRow("Ty\u00f6vaatteet",97408,128995,31.4,24.2,false)+trRow("Muut",14223,9572,-73.9,-7.4,false)+trRow("YHTEENS\u00c4",260556,274241,34.4,37.3,true);
  el.innerHTML='<div class="sec">\u25b6 Elokuu 2026 vs 2025</div><div class="card">'+trTable(eloRows)+'</div>'
    +'<div class="sec">\u25b6 Hein\u00e4kuu 2026 vs 2025</div><div class="card">'+trTable(heinaRows)+'</div>'
    +'<div class="sec">\u25b6 Kes\u00e4kuu 2026 vs 2025</div><div class="card">'+trTable(kesaRows)+'</div>';
}

function topTable(rows){
  return '<table><thead><tr><th class="c">#</th><th>Asiakas</th><th class="r">Myynti 2026 \u20ac</th><th>Huomio</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function renderTop(el){
  var elo=[["Jyv\u00e4skyl\u00e4n koulutuskuntayhtym\u00e4 Gradia",47165,"\u2b50 Uusi suurasikas"],["Niemi Palvelut Oy",10269,"\u2191 Kasvaa"],["Tana Oy",7252,"\u2191 Kasvaa"],["Kattotutka Oy",7030,"\u2191"],["KSBR Sverige AB",6035,"\u2705 Uusi kv-asiakas"],["KSBR Keski-Suomen Betonirakenne Oy",5942,"\u2194"],["Viafin Process Piping Oy",4990,"\u2191"],["Calderys Finland Oy",4253,"\u2194"],["Elega Oy",3920,"\u2194"],["Kx-Treeshears Oy",3316,"Palasi"]];
  var heina=[["Anuco Oy",7853,"\u2191"],["Kattotutka Oy",6492,"\u2191"],["KSBR Keski-Suomen Betonirakenne Oy",5424,"\u2191"],["Tana Oy",4760,"\u2191"],["Scania Suomi Oy",4251,"Palasi"],["Salvos Finland Oy",4217,"\u2191"],["Niemi Palvelut Oy",3902,"\u2191"],["Elega Oy",3338,"\u2194"],["Maansiirto Harry M\u00e4kel\u00e4 Oy",2716,"Uusi top 10"],["LVI Kurikka Oy",2544,"\u2194"]];
  var kesa=[["Anuco Oy",37297,"\u26A0\uFE0F Iso backlog"],["Lillbacka Powerco Oy",18667,"\u2705 Uusi suuri asiakas"],["Kattotutka Oy",9138,"\u2191"],["Scania Suomi Oy",8517,"\u2191"],["Niemi Palvelut Oy",7477,"\u2191"],["LLP Farm Machinery Group Oy",6508,"Uusi top 10"],["Alltvex Oy",5337,"\u2705 Uusi"],["Harvia Austria GmbH",5135,"Kv-asiakas"],["KSBR Keski-Suomen Betonirakenne Oy",5069,"\u2191"],["Eezy Oyj",5008,"Uusi top 10"]];
  function makeRows(arr){return arr.map(function(r,i){return '<tr><td class="c">'+(i+1)+'</td><td>'+r[0]+'</td><td class="r">'+fe(r[1])+'</td><td>'+r[2]+'</td></tr>';}).join("");}
  el.innerHTML='<div class="sec">\u25b6 Elokuu 2026</div><div class="card">'+topTable(makeRows(elo))+'</div>'
    +'<div class="sec">\u25b6 Hein\u00e4kuu 2026</div><div class="card">'+topTable(makeRows(heina))+'</div>'
    +'<div class="sec">\u25b6 Kes\u00e4kuu 2026</div><div class="card">'+topTable(makeRows(kesa))+'</div>';
}

function renderUudet(el){
  el.innerHTML='<div class="ytdb"><div class="ytdt">\u2705 YTD UUDET ASIAKKAAT \u2014 Tammi\u2013Elokuu 2026</div><div class="ytdg">'
    +'<div class="ytds"><div class="ytdsv">~124\u2013152</div><div class="ytdsl">Uusia/kk (arvio)</div></div>'
    +'<div class="ytds"><div class="ytdsv">~1 100</div><div class="ytdsl">YTD uusia yhteens\u00e4</div></div>'
    +'<div class="ytds"><div class="ytdsv">~150\u2013180</div><div class="ytdsl">Poistuvia/kk (arvio)</div></div>'
    +'<div class="ytds"><div class="ytdsv dn">\u221230\u201350</div><div class="ytdsl">Nettomiinus/kk</div></div>'
    +'</div></div>'
    +'<div class="sec">\u25b6 Elokuu 2026 \u2014 Merkitt\u00e4vimm\u00e4t uudet</div><div class="card"><table>'
    +'<thead><tr><th>#</th><th>Asiakas</th><th class="r">Myynti \u20ac</th><th class="c">Kate%</th><th>Potentiaali</th></tr></thead><tbody>'
    +'<tr><td>1</td><td>Jyv\u00e4skyl\u00e4n koulutuskuntayhtym\u00e4 Gradia</td><td class="r">47 165 \u20ac</td><td class="c">21.2%</td><td>\u2b50 Julkinen suurasikas \u2014 seuraa!</td></tr>'
    +'<tr><td>2</td><td>KSBR Sverige AB</td><td class="r">6 035 \u20ac</td><td class="c">20.8%</td><td>\u2705 Uusi kv-asiakas (Ruotsi)</td></tr>'
    +'<tr><td>3</td><td>Jose Kuljetus Oy</td><td class="r">4 234 \u20ac</td><td class="c">57.1%</td><td>\u2705 Hyv\u00e4 kate</td></tr>'
    +'<tr><td>4</td><td>Reaktor Innovations Oy</td><td class="r">2 470 \u20ac</td><td class="c">51.4%</td><td>\u2705 Teknologia</td></tr>'
    +'<tr><td>5</td><td>Laukaa Stars ry</td><td class="r">2 957 \u20ac</td><td class="c">67.0%</td><td>\u2705 Korkea kate</td></tr>'
    +'</tbody></table></div>'
    +'<div class="sec">\u25b6 Kes\u00e4kuu 2026 \u2014 Merkitt\u00e4vimm\u00e4t uudet</div><div class="card"><table>'
    +'<thead><tr><th>#</th><th>Asiakas</th><th class="r">Myynti \u20ac</th><th class="c">Kate%</th><th>Potentiaali</th></tr></thead><tbody>'
    +'<tr><td>1</td><td>Lillbacka Powerco Oy</td><td class="r">18 667 \u20ac</td><td class="c">19.5%</td><td>\u2b50 Iso uusi \u2014 koneteollisuus</td></tr>'

function renderBudjetti(el){
  var bd=[[202906,192772],[200313,210886],[330155,263139],[443274,335678],[343680,318889],[308021,274241],[155900,128435],[282139,235482],[717923,null],[780218,null],[800193,null],[864033,null]];
  var mnfull=["Tammikuu","Helmikuu","Maaliskuu","Huhtikuu","Toukokuu","Kes\u00e4kuu","Hein\u00e4kuu","Elokuu","Syyskuu","Lokakuu","Marraskuu","Joulukuu"];
  var rows="";
  for(var i=0;i<12;i++){
    var bud=bd[i][0],tot=bd[i][1];
    var has=tot!==null;
    var chg=has?(tot-bud)/bud*100:null;
    var st=chg===null?"\u23F3 Tulossa":chg>=0?"\u2705 Yli budjetin":chg>=-5?"\uD83D\uDCCA L\u00e4hell\u00e4":"\u26A0\uFE0F Alle";
    rows+='<tr><td>'+mnfull[i]+'</td><td class="r">'+fe(bud)+'</td><td class="r">'+(has?fe(tot):"—")+'</td>'
      +'<td class="r '+(has&&chg<0?"dn":has?"up":"")+'">'+( chg!==null?fp(chg):"—")+'</td><td>'+st+'</td></tr>';
  }
  var yc=(y26-yb)/yb*100;
  rows+='<tr class="tot"><td>YTD Tammi\u2013Elo</td><td class="r">'+fe(yb)+'</td><td class="r">'+fe(y26)+'</td><td class="r dn">'+fp(yc)+'</td><td>\u26A0\uFE0F YTD alle budjetin</td></tr>';
  el.innerHTML='<div class="ytdb"><div class="ytdt">\uD83C\uDFAF YTD vs Budjetti \u2014 Tammi\u2013Elokuu 2026</div><div class="ytdg">'
    +'<div class="ytds"><div class="ytdsv">'+(yb/1e6).toFixed(2)+' M\u20ac</div><div class="ytdsl">Budjetti YTD</div></div>'
    +'<div class="ytds"><div class="ytdsv">'+(y26/1e6).toFixed(2)+' M\u20ac</div><div class="ytdsl">Toteuma YTD</div></div>'
    +'<div class="ytds"><div class="ytdsv dn">'+fe(y26-yb)+'</div><div class="ytdsl">Ero \u20ac</div></div>'
    +'<div class="ytds"><div class="ytdsv dn">'+fp(yc)+'</div><div class="ytdsl">Ero %</div></div>'
    +'</div></div>'
    +'<div class="sec">Budjetti vs Toteuma</div><div class="card"><table>'
    +'<thead><tr><th>Kuukausi</th><th class="r">Budjetti \u20ac</th><th class="r">Toteuma \u20ac</th><th class="r">Ero %</th><th>Status</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>';
}

  var mnfull=["Tammikuu","Helmikuu","Maaliskuu","Huhtikuu","Toukokuu","Kes\u00e4kuu","Hein\u00e4kuu","Elokuu","Syyskuu","Lokakuu","Marraskuu","Joulukuu"];
  var rows="";
  var totE=0,tot25=0;
  for(var i=0;i<12;i++){

    totE+=r[3]; tot25+=r[0];
    rows+='<tr style="'+(r[4]?"":"background:#fffbeb")+'">'

      +'<td class="r">'+fe(r[2])+'</td><td class="r">'+fe(r[3])+'</td>'
      +'<td class="r '+(vs25<0?"dn":"up")+'">'+fp(vs25)+'</td>'
      +'<td class="r '+(vsb<0?"dn":"up")+'">'+fp(vsb)+'</td></tr>';
  }
  el.innerHTML='<div class="ytdb"><div class="ytdt">\uD83D\uDCC8 Ennuste 2026 \u2014 Koko vuosi</div><div class="ytdg">'
    +'<div class="ytds"><div class="ytdsv">'+(tot25/1e6).toFixed(2)+' M\u20ac</div><div class="ytdsl">Toteuma 2025</div></div>'

    +'<div class="ytds"><div class="ytdsv">'+(totE/1e6).toFixed(2)+' M\u20ac</div><div class="ytdsl">Ennuste koko 2026</div></div>'
    +'<div class="ytds"><div class="ytdsv dn">'+fp((totE-tot25)/tot25*100)+'</div><div class="ytdsl">vs 2025</div></div>'
    +'</div></div>'
    +'<div class="sec">Toteuma + Ennuste</div><div class="card"><table>'
    +'<thead><tr><th>Kuukausi</th><th class="r">Tot. 2025</th><th class="r">Tot. 2026</th><th class="r">Budjetti</th><th class="r">Ennuste</th><th class="r">vs 2025</th><th class="r">vs Bud</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>';
}
